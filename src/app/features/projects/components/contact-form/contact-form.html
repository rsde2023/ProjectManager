<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Formulaire de contact</h2>
  
  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
        Email
      </label>
      <input 
        type="email" 
        id="email" 
        formControlName="email"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        placeholder="exemple@email.com">
    </div>
    
    <button 
      type="submit" 
      class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
      [disabled]="contactForm.invalid">
      Envoyer
    </button>
  </form>

  <!-- Affichage de la valeur du formulaire en JSON -->
  <div class="mt-6">
    <h3 class="text-lg font-semibold text-gray-700 mb-2">Valeur du formulaire :</h3>
    <pre class="bg-gray-100 p-3 rounded-md text-sm overflow-x-auto">{{ contactForm.value | json }}</pre>
  </div>
  
  <div class="mt-4 grid grid-cols-2 gap-4 text-sm">
    <div class="bg-green-50 p-2 rounded">
      <span class="font-medium text-green-700">Valide :</span> 
      <span class="text-green-600">{{ contactForm.valid }}</span>
    </div>
    <div class="bg-red-50 p-2 rounded">
      <span class="font-medium text-red-700">Invalide :</span> 
      <span class="text-red-600">{{ contactForm.invalid }}</span>
    </div>
  </div>
</div>
