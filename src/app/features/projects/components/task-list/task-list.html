<div class="mt-3">
  <h3 class="text-sm font-semibold text-gray-700 mb-2">Tasks :</h3>

  @if (tasks.length === 0) {
    <p class="text-gray-500 text-sm italic">No tasks available</p>
  }

  <div class="space-y-2">
    @for (task of tasks; track task.title) {

      <div class="border-l-4 p-3 rounded"
           [ngClass]="{
             'border-yellow-500 bg-yellow-50': task.status === 'pending',
             'border-blue-500 bg-blue-50': task.status === 'In Progress',
             'border-green-500 bg-green-50': task.status === 'completed'
           }">

        <div class="flex justify-between items-start">
          <div class="flex-1">

            <h4 class="font-medium text-gray-800">
              {{ task.title }}
            </h4>

            <div class="flex gap-2 mt-2">

              <!-- Priority Badge -->
              <span class="text-xs px-2 py-1 rounded"
                    [ngClass]="{
                      'bg-red-100 text-red-800': task.priority === 'High',
                      'bg-orange-200 text-orange-800': task.priority === 'Medium',
                      'bg-green-100 text-green-800': task.priority === 'Low'
                    }">
                {{ task.priority }}
              </span>

              <!-- Status Badge -->
              <span class="text-xs px-2 py-1 rounded"
                    [ngClass]="{
                      'bg-yellow-100 text-yellow-800': task.status === 'pending',
                      'bg-blue-100 text-blue-800': task.status === 'In Progress',
                      'bg-green-100 text-green-800': task.status === 'completed'
                    }">
                {{ task.status }}
              </span>

            </div>
          </div>
        </div>

      </div>
    }
  </div>
</div>
