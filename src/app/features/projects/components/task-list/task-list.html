<div class="space-y-2">
  @if (tasks.length === 0) {
    <p class="text-gray-400 text-sm italic py-2">No tasks assigned</p>
  }

  @for (task of tasks; track task.title) {
    <div [appHighlightStatus]="task.status" class="flex items-center justify-between p-2 hover:bg-gray-50 rounded-md transition-colors duration-150">
      <!-- Task title  -->
      <div class="flex items-center space-x-3 flex-1 min-w-0 " >
        <span class="text-sm font-medium text-gray-700 truncate" >{{ task.title }}</span>
      </div>

      <!-- Priority and status badges -->
      <div class="flex items-center space-x-2 flex-shrink-0 ml-2">
        <!-- Priority badge -->
        <span class="text-xs px-2 py-0.5 rounded-full font-medium"
              [class]="getPriorityConfig(task.priority).bgClass + ' ' + getPriorityConfig(task.priority).textClass">
          {{ task.priority }}
        </span>
        
        <!-- Status badge (hidden on mobile) -->
        <span class="text-xs px-2 py-0.5 rounded-full font-medium hidden sm:block"
              [class]="getStatusConfig(task.status).badgeBg + ' ' + getStatusConfig(task.status).badgeText">
          {{ task.status }}
        </span>
      </div>
    </div>
  }
</div>
