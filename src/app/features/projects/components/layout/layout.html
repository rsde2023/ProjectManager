<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside
    class="bg-gray-900 text-white transition-all duration-300 flex flex-col"
    [class.w-64]="!isSidebarCollapsed"
    [class.w-16]="isSidebarCollapsed"
  >
    <!-- Bouton toggle -->
    <div class="flex items-center justify-end p-3 border-b border-gray-700">
      <button (click)="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-700 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            [attr.d]="
              isSidebarCollapsed ? 'M13 5l7 7-7 7M5 5l7 7-7 7' : 'M11 19l-7-7 7-7M19 19l-7-7 7-7'
            "
          />
        </svg>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 mt-6">
      <!-- 1. Projets -->
      <a
        routerLink="/projects"
        routerLinkActive="bg-blue-600"
        class="flex items-center px-4 py-3 mx-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
        [class.justify-center]="isSidebarCollapsed"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
          />
        </svg>

        @if (!isSidebarCollapsed) {
          <span class="ml-3">Projets</span>
        }
      </a>

      <!-- 2. Contact -->
      <a
        routerLink="/contact"
        routerLinkActive="bg-blue-600"
        class="flex items-center px-4 py-3 mx-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors mt-2"
        [class.justify-center]="isSidebarCollapsed"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
          />
        </svg>

        @if (!isSidebarCollapsed) {
          <span class="ml-3">Contact</span>
        }
      </a>

      <!-- 3. Inscription -->
      <a
        routerLink="/register"
        routerLinkActive="bg-blue-600"
        class="flex items-center px-4 py-3 mx-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors mt-2"
        [class.justify-center]="isSidebarCollapsed"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
          />
        </svg>

        @if (!isSidebarCollapsed) {
          <span class="ml-3">Inscription</span>
        }
      </a>

      <!-- 4. Utilisateur (Formulaire FormBuilder) - NOUVEAU -->
      <a
        routerLink="/user-form"
        routerLinkActive="bg-blue-600"
        class="flex items-center px-4 py-3 mx-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors mt-2"
        [class.justify-center]="isSidebarCollapsed"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>

        @if (!isSidebarCollapsed) {
          <span class="ml-3">Utilisateur</span>
        }
      </a>
      <a
        routerLink="/dynamic-form"
        routerLinkActive="bg-blue-600"
        class="flex items-center px-4 py-3 mx-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors mt-2"
        [class.justify-center]="isSidebarCollapsed"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>

        @if (!isSidebarCollapsed) {
          <span class="ml-3">Dynamique</span>
        }
      </a>
      <!-- 6. Adresses (FormGroup imbriqué + FormArray) -->
      <a
        routerLink="/address-form"
        routerLinkActive="bg-blue-600"
        class="flex items-center px-4 py-3 mx-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors mt-2"
        [class.justify-center]="isSidebarCollapsed"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          />
        </svg>
        @if (!isSidebarCollapsed) {
          <span class="ml-3">Adresses</span>
        }
      </a>
      <!-- 7. Service erreurs + Directive -->
      <a
        routerLink="/error-demo"
        routerLinkActive="bg-blue-600"
        class="flex items-center px-4 py-3 mx-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors mt-2"
        [class.justify-center]="isSidebarCollapsed"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
        @if (!isSidebarCollapsed) {
          <span class="ml-3">Erreurs</span>
        }
      </a>
    </nav>
  </aside>

  <!-- Contenu principal -->
  <main class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </main>
</div>
