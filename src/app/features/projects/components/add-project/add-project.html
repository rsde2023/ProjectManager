<div
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
  (click)="closeModal()"
>
  <div
    class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[85vh] overflow-y-auto"
    (click)="$event.stopPropagation()"
  >
    <!-- En-tête - plus compact -->
    <div class="flex justify-between items-center px-4 py-3 border-b sticky top-0 bg-white z-10">
      <h2 class="text-lg font-bold text-gray-800">Ajouter un projet</h2>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Messages -->
    @if (successMessage) {
      <div
        class="mx-4 mt-3 p-2 bg-green-100 border border-green-400 text-green-700 rounded text-sm"
      >
        {{ successMessage }}
      </div>
    }

    @if (errorMessage) {
      <div class="mx-4 mt-3 p-2 bg-red-100 border border-red-400 text-red-700 rounded text-sm">
        {{ errorMessage }}
      </div>
    }

    <!-- Formulaire - paddings réduits -->
    <form (ngSubmit)="onSubmit()" class="p-4 space-y-3">
      <!-- Nom du projet -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-0.5">
          Nom du projet <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="newProject.name"
          name="projectName"
          class="w-full px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
          placeholder="Ex: Application Mobile"
        />
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-0.5">
          Description <span class="text-red-500">*</span>
        </label>
        <textarea
          [(ngModel)]="newProject.description"
          name="projectDescription"
          rows="2"
          class="w-full px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
          placeholder="Description détaillée du projet..."
        ></textarea>
      </div>

      <!-- Statut -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-0.5">
          Statut <span class="text-red-500">*</span>
        </label>
        <select
          [(ngModel)]="newProject.status"
          name="projectStatus"
          class="w-full px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
        >
          <option value="" disabled>Sélectionnez un statut</option>
          <option value="pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <!-- Section Tâches -->
      <div class="border-t pt-3">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">Tâches (optionnel)</h3>

        <!-- Formulaire d'ajout de tâche - plus compact -->
        <div class="flex gap-2 mb-2">
          <input
            type="text"
            [(ngModel)]="newTask.title"
            name="taskTitle"
            class="flex-1 px-2 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            placeholder="Nom de la tâche"
          />
          <select
            [(ngModel)]="newTask.priority"
            name="taskPriority"
            class="px-2 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm w-24"
          >
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
          <button
            type="button"
            (click)="addTask()"
            class="px-3 py-1.5 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors text-sm"
          >
            +
          </button>
        </div>

        <!-- Liste des tâches -->
        @if (tasks.length > 0) {
          <div class="bg-gray-50 rounded-md p-2 max-h-32 overflow-y-auto">
            @for (task of tasks; track $index) {
              <div class="flex justify-between items-center p-1.5 border-b last:border-0 text-sm">
                <div>
                  <span class="font-medium">{{ task.title }}</span>
                  <span
                    class="ml-2 text-xs px-1.5 py-0.5 rounded-full"
                    [class.bg-green-100]="task.priority === 'Low'"
                    [class.bg-yellow-100]="task.priority === 'Medium'"
                    [class.bg-red-100]="task.priority === 'High'"
                  >
                    {{ task.priority }}
                  </span>
                </div>
                <button
                  type="button"
                  (click)="removeTask($index)"
                  class="text-red-500 hover:text-red-700"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </button>
              </div>
            }
          </div>
        }
      </div>

      <!-- Boutons d'action - plus compact -->
      <div class="flex justify-end gap-3 pt-3 border-t">
        <button
          type="button"
          (click)="closeModal()"
          class="px-3 py-1.5 text-sm text-gray-600 hover:text-gray-800 transition-colors"
        >
          Annuler
        </button>
        <button
          type="submit"
          class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors disabled:opacity-50"
          [disabled]="
            !newProject.name.trim() || !newProject.description.trim() || !newProject.status
          "
        >
          Créer
        </button>
      </div>
    </form>
  </div>
</div>
