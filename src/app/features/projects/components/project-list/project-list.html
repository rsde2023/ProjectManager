<div class="container mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6 text-gray-800">Project Management</h1>
  
  <div class="space-y-4">
    @for (project of Projects; track project.name) {
      <div class="bg-white shadow rounded p-4">
        <div class="border-b pb-3 mb-3">
          <h2 class="text-xl font-semibold text-gray-800">{{ project.name }}</h2>
          <p class="text-gray-600 text-sm mt-1">{{ project.description }}</p>
          <span class="inline-block mt-2 px-3 py-1 rounded-full text-sm"
                [ngClass]="{
                  'bg-green-100 text-green-800': project.status === 'completed',
                  'bg-orange-200 text-orange-800': project.status === 'pending',
                  'bg-blue-100 text-blue-800': project.status === 'In Progress'
                }">
            {{ project.status }}
          </span>
        </div>
        
        <!-- Liste des tâches -->
        <app-task-list [tasks]="project.tasks"></app-task-list>
      </div>
    }
  </div>
</div>
