<div class="min-h-screen bg-gray-100 relative">
  

  <!-- Bouton flottant pour ajouter un projet -->
  <button
    (click)="openAddProjectModal()"
    class="fixed bottom-8 right-8 bg-blue-600 text-white rounded-full p-4 shadow-lg hover:bg-blue-700 hover:shadow-xl transition-all duration-300 z-50 group"
    title="Ajouter un projet"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:rotate-90 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
  </button>
  
  <!-- Modal - géré par le parent -->
  @if (showModal) {
    <app-add-project 
      (close)="closeModal()" 
      (projectAdded)="onProjectAdded($event)">
    </app-add-project>
  }
  
  <!-- Liste des projets -->
  <app-project-list 
    [projects]="projects" 
    (projectDeleted)="onProjectDeleted($event)">
  </app-project-list>
  
</div>
